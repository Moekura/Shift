<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
</head>
<body>

<select id="staff"></select>
<select id="period"></select>
<table id="table" border="1"></table>
<button onclick="save()">保存</button>

<script>
const API_URL = "你的GAS網址";
const DELETE_MARK = "__DELETE__";

let shifts = [];
let adminEdits = [];
let periods = [];
let staffList = [];
let pending = {};

async function init(){
  const res = await fetch(API_URL);
  const data = await res.json();

  shifts = data.shifts || [];
  adminEdits = data.adminEdits || [];
  periods = data.periods || [];
  staffList = data.staffList || [];

  renderSelect();
  render();
}

function renderSelect(){
  staff.innerHTML = staffList.map(s=>`<option>${s.name}</option>`).join('');
  period.innerHTML = periods.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
  staff.onchange = render;
  period.onchange = render;
}

function getValue(name,periodId,date){
  const key = `${name}_${periodId}_${date}`;

  if(key in pending){
    return pending[key];
  }

  const admin = adminEdits.find(r =>
    r.name===name && r.periodId===periodId && r.date===date
  );

  if(admin){
    if(admin.time === DELETE_MARK) return '';
    return admin.time;
  }

  const shift = shifts.find(r =>
    r.name===name && r.periodId===periodId && r.date===date
  );

  return shift ? shift.time : '';
}

function render(){
  const name = staff.value;
  const pid = period.value;

  table.innerHTML = '';

  for(let i=0;i<7;i++){
    const d = new Date();
    d.setDate(d.getDate()+i);
    const date = d.toISOString().slice(0,10);

    const val = getValue(name,pid,date);

    table.innerHTML += `
      <tr>
        <td>${date}</td>
        <td>
          <input value="${val}"
            onchange="update('${name}','${pid}','${date}',this.value)">
        </td>
      </tr>`;
  }
}

function update(name,pid,date,val){
  const key = `${name}_${pid}_${date}`;
  pending[key] = val === '' ? '' : val;
}

async function save(){
  const pid = period.value;

  const grouped = {};

  Object.keys(pending).forEach(k=>{
    const [name,pid2,date] = k.split('_');
    if(pid2!==pid) return;

    if(!grouped[name]) grouped[name]={name,days:{}};
    grouped[name].days[date]=pending[k];
  });

  await fetch(API_URL,{
    method:'POST',
    body:JSON.stringify({
      action:'saveAdminEditsBulk',
      periodId:pid,
      allEdits:Object.values(grouped)
    })
  });

  pending = {};
  alert('已保存');
  init();
}

init();
</script>

</body>
</html>
