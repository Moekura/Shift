<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Shift Admin</title>
</head>
<body>

<select id="staff"></select>
<select id="period"></select>
<button onclick="save()">保存</button>

<div id="table"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbw8zLwCD54EYitPRno2ZxKTpXgWV1GQaU2Z82Vgt4CV9274dV91XsGEtMHKvHZ03J31_w/exec";

let DATA = {};

function load() {
  fetch(API_URL)
    .then(r => r.json())
    .then(d => {
      DATA = d;
      initSelect();
      render();
    });
}

function initSelect() {
  const staff = document.getElementById("staff");
  const period = document.getElementById("period");

  staff.innerHTML = DATA.staffList.map(s =>
    "<option value='" + s.name + "'>" + s.name + "</option>"
  ).join("");

  period.innerHTML = DATA.periods.map(p =>
    "<option value='" + p.id + "'>" + p.name + "</option>"
  ).join("");
}

function buildMap() {
  const map = {};

  // 原始 shift
  DATA.shifts.forEach(s => {
    const key = s.name + "||" + s.periodId + "||" + s.date;
    map[key] = s.time;
  });

  // admin 覆蓋
  DATA.adminEdits.forEach(a => {
    const key = a.name + "||" + a.periodId + "||" + a.date;

    if (a.time === "__DELETE__") {
      delete map[key];
    } else {
      map[key] = a.time;
    }
  });

  return map;
}

function render() {
  const name = document.getElementById("staff").value;
  const periodId = document.getElementById("period").value;

  const map = buildMap();

  const dates = [];
  DATA.shifts.forEach(s => {
    if (dates.indexOf(s.date) === -1) {
      dates.push(s.date);
    }
  });

  let html = "<table border='1'>";
  html += "<tr><th>日期</th><th>時間</th></tr>";

  dates.forEach(d => {
    const key = name + "||" + periodId + "||" + d;
    const time = map[key] || "";

    html += "<tr>";
    html += "<td>" + d + "</td>";
    html += "<td><input data-date='" + d + "' value='" + time + "'></td>";
    html += "</tr>";
  });

  html += "</table>";

  document.getElementById("table").innerHTML = html;
}

function save() {
  const name = document.getElementById("staff").value;
  const periodId = document.getElementById("period").value;

  const inputs = document.querySelectorAll("input");

  const days = {};

  inputs.forEach(i => {
    const val = i.value.trim();

    if (val === "") {
      days[i.dataset.date] = "__DELETE__";
    } else {
      days[i.dataset.date] = val;
    }
  });

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "saveAdminEdits",
      name: name,
      periodId: periodId,
      days: days
    })
  }).then(() => {
    alert("已保存");
    load();
  });
}

document.getElementById("staff").onchange = render;
document.getElementById("period").onchange = render;

load();
</script>

</body>
</html>
