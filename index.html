<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>シフト希望登録</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap');
:root{
  --bg:#f5f5f5;--white:#fff;--black:#1a1a1a;--border:#1a1a1a;
  --yellow:#F7C242;--teal:#69B0AC;--red:#e03030;
  --text:#1a1a1a;--text2:#555;--text3:#888;
  --ybg:#fdf6dc;--tbg:#e8f4f3;--rbg:#fdeaea;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans TC','Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.screen{display:none;min-height:100vh;}
.screen.active{display:flex;flex-direction:column;}

/* ROLE */
#screen-role{align-items:center;justify-content:center;}
.role-logo{width:48px;height:5px;background:var(--yellow);margin:0 auto 18px;}
.role-card{text-align:center;padding:48px 28px;}
.role-card h1{font-size:1.7rem;font-weight:700;margin-bottom:6px;letter-spacing:.05em;}
.role-card h1 span{color:var(--yellow);}
.role-card p{color:var(--text2);margin-bottom:36px;font-size:.875rem;}
.role-buttons{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}
.role-btn{width:170px;padding:26px 16px;background:var(--white);border:1px solid var(--border);border-top:3px solid transparent;cursor:pointer;transition:all .15s;color:var(--text);font-family:inherit;}
.role-btn:hover{border-top-color:var(--yellow);background:var(--ybg);}
.role-btn .icon{font-size:2rem;margin-bottom:10px;}
.role-btn .label{font-size:.9rem;font-weight:700;letter-spacing:.04em;}
.role-btn .sub{font-size:.7rem;color:var(--text3);margin-top:4px;}

/* HEADER */
.app-header{display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--black);height:50px;flex-shrink:0;}
.app-header h2{font-size:.875rem;font-weight:700;color:var(--yellow);letter-spacing:.06em;}
.hdr-right{display:flex;gap:8px;align-items:center;}

/* BUTTONS */
.btn{padding:7px 14px;border:1px solid var(--border);cursor:pointer;font-family:inherit;font-size:.78rem;font-weight:700;transition:all .12s;letter-spacing:.02em;}
.btn-primary{background:var(--yellow);color:var(--black);border-color:var(--yellow);}
.btn-primary:hover{background:#e0a820;}
.btn-secondary{background:var(--white);color:var(--black);}
.btn-secondary:hover{background:var(--ybg);border-color:var(--yellow);}
.btn-danger{background:var(--rbg);color:var(--red);border-color:var(--red);}
.btn-teal{background:var(--teal);color:#fff;border-color:var(--teal);}
.btn-teal:hover{background:#5a9d99;}
.back-btn{background:transparent;border:1px solid rgba(255,255,255,.3);color:rgba(255,255,255,.75);padding:5px 10px;cursor:pointer;font-family:inherit;font-size:.75rem;transition:all .12s;}
.back-btn:hover{border-color:var(--yellow);color:var(--yellow);}

/* FORM */
select,input[type=date],input[type=month],input[type=text],input[type=password]{
  background:var(--white);border:1px solid var(--border);color:var(--text);
  padding:7px 10px;font-family:inherit;font-size:.82rem;outline:none;
}
select:focus,input:focus{border-color:var(--yellow);}

/* TABS */
.tab-bar{display:flex;border-bottom:2px solid var(--border);background:var(--white);flex-shrink:0;}
.tab{padding:10px 20px;background:transparent;border:none;color:var(--text3);cursor:pointer;font-family:inherit;font-size:.8rem;font-weight:700;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .12s;}
.tab.active{color:var(--black);border-bottom-color:var(--yellow);background:var(--ybg);}
.tab:hover:not(.active){color:var(--black);}
.tab-content{display:none;}
.tab-content.active{display:block;}

/* OVERLAY */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;}
.overlay.open{display:flex;}
.popup{background:var(--white);border:1px solid var(--border);border-top:3px solid var(--yellow);padding:26px;width:310px;max-width:92vw;}
.popup h4{font-size:.9rem;font-weight:700;margin-bottom:16px;}
.time-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.time-row label{font-size:.75rem;color:var(--text2);width:36px;font-weight:600;}
.tsel{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:7px 8px;font-family:inherit;font-size:.88rem;outline:none;}
.popup-actions{display:flex;gap:7px;margin-top:8px;}

/* STAFF SCREEN */
#screen-staff{background:var(--bg);}
.staff-wrap{max-width:800px;margin:0 auto;padding:24px 16px;flex:1;}
.step-block{margin-bottom:28px;}
.step-num{display:inline-flex;align-items:center;justify-content:center;background:var(--black);color:var(--yellow);font-size:.68rem;font-weight:700;width:20px;height:20px;margin-bottom:7px;}
.step-title{font-size:.95rem;font-weight:700;border-bottom:2px solid var(--yellow);padding-bottom:3px;display:inline-block;margin-bottom:4px;}
.step-sub{font-size:.75rem;color:var(--text2);margin-bottom:14px;}

.name-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:5px;}
.name-chip{padding:8px 10px;background:var(--white);border:1px solid #ccc;border-left:3px solid transparent;cursor:pointer;text-align:center;font-size:.8rem;transition:all .12s;font-family:inherit;color:var(--text);}
.name-chip:hover{border-left-color:var(--yellow);background:var(--ybg);}
.name-chip.selected{border-left-color:var(--yellow);background:var(--ybg);font-weight:700;}

.period-list{display:flex;flex-direction:column;gap:5px;}
.period-chip{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;background:var(--white);border:1px solid #ccc;border-left:3px solid transparent;cursor:pointer;transition:all .12s;}
.period-chip:hover{border-left-color:var(--yellow);background:var(--ybg);}
.period-chip.selected{border-left-color:var(--yellow);background:var(--ybg);}
.period-chip .pname{font-weight:700;font-size:.875rem;}
.period-chip .pdates{font-size:.72rem;color:var(--text2);}
.period-chip .pcheck{opacity:0;color:var(--yellow);font-size:.95rem;}
.period-chip.selected .pcheck{opacity:1;}
.no-periods{color:var(--text3);font-size:.82rem;padding:14px 0;}

/* CALENDAR */
.cal-dow-row{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:2px;}
.cal-dow{text-align:center;font-size:.65rem;font-weight:700;padding:4px;background:var(--black);color:#fff;}
.cal-dow.sun{background:var(--red);}
.cal-dow.sat{background:var(--teal);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:20px;}
.cal-day{background:var(--white);border:1px solid #ddd;padding:6px 4px;cursor:pointer;transition:all .12s;min-height:58px;}
.cal-day.empty{background:transparent;border-color:transparent;cursor:default;}
.cal-day:not(.empty):hover{border-color:var(--yellow);background:var(--ybg);}
.cal-day.has-time{background:var(--tbg);border-color:var(--teal);border-left:3px solid var(--teal);}
.cal-day.today{border-top:3px solid var(--yellow);}
.day-num{font-size:.75rem;font-weight:700;margin-bottom:2px;}
.cal-day.sun .day-num{color:var(--red);}
.cal-day.sat .day-num{color:var(--teal);}
.day-time{font-size:.58rem;color:var(--teal);font-weight:700;background:rgba(105,176,172,.15);padding:1px 3px;}

/* SUMMARY */
.summary-box{background:var(--ybg);border:1px solid var(--border);border-left:4px solid var(--yellow);padding:14px;margin-bottom:18px;}
.summary-box h4{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;}
.s-item{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(0,0,0,.07);font-size:.8rem;}
.s-item:last-child{border-bottom:none;}
.s-date{color:var(--text2);}
.s-time{color:var(--teal);font-weight:700;}
.submit-btn{width:100%;padding:12px;background:var(--yellow);color:var(--black);border:none;font-family:inherit;font-size:.9rem;font-weight:700;cursor:pointer;transition:all .12s;letter-spacing:.04em;}
.submit-btn:hover{background:#e0a820;}
.submit-btn:disabled{opacity:.35;cursor:not-allowed;}

/* ADMIN */
#screen-admin{background:var(--bg);}
.admin-wrap{max-width:1200px;margin:0 auto;padding:20px 16px;flex:1;}
.panel{background:var(--white);border:1px solid #ddd;border-top:3px solid var(--yellow);padding:18px;margin-bottom:16px;}
.panel-title{font-size:.7rem;font-weight:700;letter-spacing:.1em;color:var(--text3);text-transform:uppercase;margin-bottom:12px;border-bottom:1px solid #eee;padding-bottom:7px;}
.period-list-admin{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.period-row{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--bg);border:1px solid #ddd;border-left:3px solid transparent;cursor:pointer;transition:all .12s;}
.period-row:hover{border-left-color:var(--yellow);background:var(--ybg);}
.pr-name{flex:1;font-weight:700;font-size:.85rem;}
.pr-dates{font-size:.72rem;color:var(--text2);}
.pr-del{background:transparent;border:1px solid #ccc;color:var(--text3);padding:3px 8px;cursor:pointer;font-size:.7rem;transition:all .12s;font-family:inherit;}
.pr-del:hover{border-color:var(--red);color:var(--red);}
.new-period-form{display:flex;gap:7px;flex-wrap:wrap;align-items:flex-end;}
.form-group{display:flex;flex-direction:column;gap:3px;}
.form-group label{font-size:.7rem;color:var(--text2);font-weight:600;}

.view-toggle{display:flex;background:var(--white);border:1px solid var(--border);overflow:hidden;}
.vt-btn{padding:6px 14px;background:transparent;border:none;color:var(--text2);cursor:pointer;font-family:inherit;font-size:.75rem;font-weight:700;transition:all .12s;}
.vt-btn.active{background:var(--yellow);color:var(--black);}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap;}

.table-wrap{overflow-x:auto;border:1px solid var(--border);}
.th-name,.th-type-col{position:sticky;z-index:3;background:var(--black);}
.th-name{left:0;}
.th-type-col{left:90px;}
td.td-name{position:sticky;left:0;z-index:2;background:var(--white);box-shadow:2px 0 3px rgba(0,0,0,.07);}
td.td-type{position:sticky;left:90px;z-index:2;background:var(--white);}
tr:hover td.td-name,tr:hover td.td-type{background:#fafafa;}
.total-row td.td-name,.total-row td.td-type{background:#efefef;}
table{width:100%;border-collapse:collapse;font-size:.75rem;white-space:nowrap;}
th{background:var(--black);padding:8px 9px;text-align:center;border-right:1px solid #333;color:#fff;font-weight:700;font-size:.7rem;letter-spacing:.03em;}
th.th-name{text-align:left;min-width:90px;}
td{padding:6px 7px;border-bottom:1px solid #e0e0e0;border-right:1px solid #e0e0e0;text-align:center;vertical-align:middle;}
td.td-name{text-align:left;font-weight:600;background:var(--white);}
td.td-type{color:var(--text3);font-size:.7rem;background:var(--white);}
td.td-hours{font-weight:700;background:var(--ybg);}
tr:hover td{background:#fafafa;}
tr:hover td.td-hours{background:var(--ybg);}
.total-row td{background:#efefef;font-weight:700;}
.total-row td.td-hours{background:var(--ybg);}
.sc{display:inline-block;font-size:.66rem;padding:2px 5px;min-width:50px;font-weight:600;}
.sc-staff{background:var(--tbg);color:var(--teal);}
.edit-cell input{width:76px;background:var(--white);border:1px solid var(--teal);color:var(--text);padding:2px 5px;font-family:inherit;font-size:.7rem;text-align:center;outline:none;}
.edit-cell input.warn{border-color:var(--red);color:var(--red);background:var(--rbg);}

.stats-row{display:flex;gap:7px;margin-bottom:16px;flex-wrap:wrap;}
.stat{background:var(--white);border:1px solid #ddd;border-top:3px solid var(--yellow);padding:12px 15px;flex:1;min-width:100px;}
.stat .sl{font-size:.66rem;color:var(--text3);margin-bottom:3px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
.stat .sv{font-size:1.3rem;font-weight:700;}

.staff-edit-list{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;}
.sei{display:flex;gap:5px;align-items:center;}
.sei input{flex:1;background:var(--bg);border:1px solid #ccc;color:var(--text);padding:5px 8px;font-family:inherit;font-size:.78rem;outline:none;}
.sei select{min-width:72px;}
.icon-btn{background:transparent;border:1px solid #ccc;color:var(--text3);padding:4px 8px;cursor:pointer;font-size:.7rem;transition:all .12s;font-family:inherit;}
.icon-btn.rm:hover{border-color:var(--red);color:var(--red);}
.icon-btn.add:hover{border-color:var(--teal);color:var(--teal);}

.legend{display:flex;gap:12px;font-size:.7rem;color:var(--text2);align-items:center;flex-wrap:wrap;}
.leg-item{display:flex;align-items:center;gap:4px;font-weight:600;}
.leg-dot{width:9px;height:9px;}

.toast{position:fixed;bottom:20px;right:20px;background:var(--black);color:var(--yellow);padding:10px 16px;border-left:4px solid var(--yellow);font-weight:700;font-size:.82rem;opacity:0;transform:translateY(10px);transition:all .28s;z-index:999;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}
.toast.error{background:var(--red);color:#fff;border-left-color:#900;}

.loading-bar{height:3px;background:var(--yellow);width:0%;transition:width .3s;position:fixed;top:0;left:0;z-index:9999;}
</style>
</head>
<body>

<!-- ROLE -->
<div id="screen-role" class="screen active">
  <div class="role-card">
    <div class="role-logo"></div>
    <h1>シフト希望 <span>登録</span></h1>
    <p>出勤希望時間帯登記システム</p>
    <div class="role-buttons">
      <button class="role-btn" onclick="goStaff()">
        <div class="icon">👤</div>
        <div class="label">スタッフ</div>
        <div class="sub">出勤希望を登録</div>
      </button>
      <button class="role-btn" onclick="askAdminPassword()">
        <div class="icon">📊</div>
        <div class="label">管理者</div>
        <div class="sub">シフト表を管理</div>
      </button>
    </div>
  </div>
</div>

<!-- PASSWORD OVERLAY -->
<div class="overlay" id="pw-overlay">
  <div class="popup" style="text-align:center;">
    <div style="font-size:1.8rem;margin-bottom:10px;">🔒</div>
    <h4 style="margin-bottom:6px;">管理者パスワード</h4>
    <p style="font-size:.75rem;color:var(--text2);margin-bottom:16px;">パスワードを入力してください</p>
    <input type="password" id="pw-input" placeholder="パスワード"
      style="width:100%;padding:9px;text-align:center;margin-bottom:6px;"
      onkeydown="if(event.key==='Enter')checkPassword()">
    <div id="pw-error" style="color:var(--red);font-size:.75rem;height:16px;margin-bottom:8px;"></div>
    <div style="display:flex;gap:7px;">
      <button class="btn btn-secondary" style="flex:1" onclick="document.getElementById('pw-overlay').classList.remove('open')">キャンセル</button>
      <button class="btn btn-primary" style="flex:1" onclick="checkPassword()">ログイン</button>
    </div>
    <div style="margin-top:14px;padding-top:12px;border-top:1px solid #eee;">
      <div style="font-size:.7rem;color:var(--text3);margin-bottom:7px;">パスワードを変更</div>
      <div style="display:flex;gap:5px;">
        <input type="password" id="pw-new" placeholder="新しいパスワード" style="flex:1;padding:6px 8px;">
        <button class="btn btn-secondary" onclick="changePassword()">変更</button>
      </div>
    </div>
  </div>
</div>

<!-- TIME POPUP -->
<div class="overlay" id="time-overlay">
  <div class="popup">
    <h4 id="popup-title">時間帯を選択</h4>
    <div class="time-row">
      <label>開始</label>
      <select class="tsel" id="t-start"></select>
    </div>
    <div class="time-row">
      <label>終了</label>
      <select class="tsel" id="t-end"></select>
    </div>
    <div id="break-note" style="font-size:.7rem;color:#8a6d00;background:var(--ybg);padding:5px 8px;margin-bottom:8px;display:none;">
      ⚠ 6時間超のため、休憩1時間を自動控除します
    </div>
    <div class="popup-actions">
      <button class="btn btn-secondary" onclick="closeTimePopup()">キャンセル</button>
      <button class="btn btn-danger" id="popup-del" onclick="clearDay()">削除</button>
      <button class="btn btn-primary" onclick="confirmTime()">決定</button>
    </div>
  </div>
</div>

<!-- STAFF SCREEN -->
<div id="screen-staff" class="screen">
  <div class="app-header">
    <button class="back-btn" onclick="showScreen('role')">← 戻る</button>
    <h2>出勤希望登録</h2>
    <div class="hdr-right"></div>
  </div>
  <div class="staff-wrap">
    <div class="step-block">
      <div class="step-num">1</div>
      <div class="step-title">お名前を選択</div>
      <div class="step-sub">リストからあなたの名前を選んでください</div>
      <div class="name-grid" id="name-grid"></div>
    </div>
    <div class="step-block">
      <div class="step-num">2</div>
      <div class="step-title">期間を選択</div>
      <div class="step-sub">管理者が設定した募集期間を選んでください</div>
      <div class="period-list" id="staff-period-list"></div>
    </div>
    <div id="cal-section" style="display:none;">
      <div class="step-block">
        <div class="step-num">3</div>
        <div class="step-title">出勤できる日を選択</div>
        <div class="step-sub">日付をクリック → 12:00〜22:00で時間帯を設定</div>
        <div class="cal-dow-row">
          <div class="cal-dow sun">日</div><div class="cal-dow">月</div><div class="cal-dow">火</div>
          <div class="cal-dow">水</div><div class="cal-dow">木</div><div class="cal-dow">金</div>
          <div class="cal-dow sat">土</div>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>
      <div class="summary-box" id="summary-box" style="display:none;">
        <h4>登録内容</h4>
        <div id="summary-list"></div>
      </div>
      <button class="submit-btn" id="submit-btn" onclick="submitShift()" disabled>登録を完了する ✓</button>
    </div>
  </div>
</div>

<!-- ADMIN SCREEN -->
<div id="screen-admin" class="screen">
  <div class="app-header">
    <button class="back-btn" onclick="showScreen('role')">← 戻る</button>
    <h2>管理者パネル</h2>
    <div class="hdr-right">
      <button class="btn btn-secondary" onclick="printShift()" style="border-color:#fff;color:#fff;">🖨 印刷</button>
      <button class="btn btn-teal" onclick="exportExcel()">⬇ Excel</button>
    </div>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
    <div class="tab-bar" style="padding:0 20px;">
      <button class="tab active" onclick="switchTab('shift',this)">シフト管理</button>
      <button class="tab" onclick="switchTab('periods',this)">期間設定</button>
      <button class="tab" onclick="switchTab('staff-cfg',this)">スタッフ設定</button>
    </div>

    <!-- SHIFT TAB -->
    <div class="tab-content active" id="tab-shift" style="flex:1;overflow:auto;">
      <div class="admin-wrap">
        <div class="panel" style="margin-bottom:12px;">
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
            <span style="font-size:.78rem;color:var(--text2);">期間:</span>
            <select id="admin-period-sel" onchange="renderAdminTable()" style="min-width:200px;"></select>
            <div class="view-toggle">
              <button class="vt-btn active" id="vt-staff" onclick="setView('staff')">📋 提出データ</button>
              <button class="vt-btn" id="vt-admin" onclick="setView('admin')">✏️ 排班調整</button>
            </div>
            <button class="btn btn-secondary" id="save-admin-btn" onclick="saveAdminEdits()" style="display:none;">💾 保存</button>
            <button class="btn btn-danger" onclick="clearPeriodData()" style="font-size:.72rem;padding:5px 10px;">🗑 期間データ削除</button>
            <div class="legend">
              <div class="leg-item"><div class="leg-dot" style="background:var(--tbg);border:1px solid var(--teal);"></div>提出</div>
              <div class="leg-item" id="leg-warn" style="display:none;"><div class="leg-dot" style="background:var(--rbg);border:1px solid var(--red);"></div>範囲外</div>
            </div>
          </div>
        </div>
        <div class="stats-row" id="stats-row"></div>
        <div class="table-wrap">
          <table><thead id="admin-thead"></thead><tbody id="admin-tbody"></tbody></table>
        </div>
      </div>
    </div>

    <!-- PERIODS TAB -->
    <div class="tab-content" id="tab-periods">
      <div class="admin-wrap">
        <div class="panel">
          <div class="panel-title">新しい期間を作成</div>
          <div class="new-period-form">
            <div class="form-group"><label>期間名</label><input type="text" id="np-name" placeholder="例: 6月前半" style="min-width:120px;"></div>
            <div class="form-group"><label>開始日</label><input type="date" id="np-start"></div>
            <div class="form-group"><label>終了日</label><input type="date" id="np-end"></div>
            <button class="btn btn-primary" onclick="createPeriod()" style="align-self:flex-end;">＋ 作成</button>
          </div>
        </div>
        <div class="panel">
          <div class="panel-title">期間リスト</div>
          <div class="period-list-admin" id="period-list-admin"></div>
        </div>
      </div>
    </div>

    <!-- STAFF CONFIG TAB -->
    <div class="tab-content" id="tab-staff-cfg">
      <div class="admin-wrap">
        <div class="panel">
          <div class="panel-title">スタッフリスト</div>
          <div class="staff-edit-list" id="staff-edit-list"></div>
          <button class="icon-btn add" onclick="addStaffRow()">＋ 追加</button>
          <div style="display:flex;gap:7px;margin-top:12px;">
            <button class="btn btn-primary" onclick="saveStaffList()">保存</button>
            <button class="btn btn-secondary" onclick="resetStaffList()">リセット</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="loading-bar" id="loading-bar"></div>
<div class="toast" id="toast"></div>

<script>
// ============================================================
// CONFIG
// ============================================================
const GAS_URL = 'https://script.google.com/macros/s/AKfycbw8zLwCD54EYitPRno2ZxKTpXgWV1GQaU2Z82Vgt4CV9274dV91XsGEtMHKvHZ03J31_w/exec';
const DEFAULT_PW = 'admin1234';
const DOW = ['日','月','火','水','木','金','土'];

const DEFAULT_STAFF = [
  {name:'張懷文',type:'店長'},{name:'何欣宜',type:'社員'},{name:'王狄',type:'社員'},
  {name:'田佳良',type:'28'},{name:'刘悦彤',type:'28'},{name:'霍嘉怡',type:'28'},
  {name:'武啸汐',type:'28'},{name:'贾子璇',type:'28'},{name:'刘芮岐',type:'28'},
  {name:'李芊媛',type:'28'},{name:'高浩瀚',type:'28'},{name:'孔祥蕊',type:'28'},
  {name:'张婷婷',type:'28'},{name:'畠中未来',type:'30'},{name:'中村瑠菜',type:''},
  {name:'塩田彩乃',type:''},{name:'熊谷月渚',type:''},{name:'杉崎陽菜',type:''},
  {name:'冨樫優斗',type:''},{name:'志村 美咲',type:''},{name:'林郁芯',type:'18'},
  {name:'柏妤欣',type:''},{name:'川島 知苗',type:''},{name:'CHO EUNJI',type:''},
];

// ============================================================
// STATE (localStorage as cache)
// ============================================================
let staffList  = JSON.parse(localStorage.getItem('staffList')  || 'null') || DEFAULT_STAFF;
let periods    = JSON.parse(localStorage.getItem('periods')    || '[]');
let shiftData  = JSON.parse(localStorage.getItem('shiftData')  || '{}');
let adminEdits = JSON.parse(localStorage.getItem('adminEdits') || '{}');

function saveLocal() {
  localStorage.setItem('staffList',  JSON.stringify(staffList));
  localStorage.setItem('periods',    JSON.stringify(periods));
  localStorage.setItem('shiftData',  JSON.stringify(shiftData));
  localStorage.setItem('adminEdits', JSON.stringify(adminEdits));
}

// ============================================================
// CLOUD (Google Apps Script)
// ============================================================
function setLoading(pct) {
  document.getElementById('loading-bar').style.width = pct + '%';
  if (pct >= 100) setTimeout(() => document.getElementById('loading-bar').style.width = '0%', 400);
}

async function cloudPost(body) {
  try {
    const res = await fetch(GAS_URL, {method:'POST', body: JSON.stringify(body)});
    const json = await res.json();
    return json.ok === true;
  } catch(e) { return false; }
}

async function syncFromCloud() {
  setLoading(20);
  try {
    const res = await fetch(GAS_URL + '?t=' + Date.now());
    setLoading(60);
    const json = await res.json();
    if (!json.ok) { setLoading(100); return false; }

    // periods — normalize dates (GAS may return ISO strings like 2026-05-10T15:00:00.000Z)
    // Convert any date value to YYYY-MM-DD string
    // GAS returns Date objects as ISO strings; take the date BEFORE the T to avoid timezone shift
    function toDateStr(v) {
      if (!v) return '';
      const s = String(v).trim();
      // Already YYYY-MM-DD
      if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
      // ISO string: 2026-05-11T15:00:00.000Z — take only the part before T
      const tIdx = s.indexOf('T');
      if (tIdx === 10) return s.slice(0, 10);
      // Fallback
      return s.slice(0, 10);
    }
    // Validate that a string is a valid shift time like "12-22"
    function isValidTime(v) {
      if (!v) return false;
      const s = String(v).trim();
      return /^\d{1,2}-\d{1,2}$/.test(s);
    }
    if (Array.isArray(json.periods) && json.periods.length > 0) {
      periods = json.periods.map(p => ({
        id:    String(p.id   ?? ''),
        name:  String(p.name ?? ''),
        start: toDateStr(p.start),
        end:   toDateStr(p.end),
      }));
    }

    // shiftData — only store valid time strings like "12-22"
    const sd = {};
    (json.shifts || []).forEach(r => {
      if (!r.name || !r.periodId || !r.date || !r.time) return;
      const timeStr = String(r.time).trim();
      if (!isValidTime(timeStr)) return; // skip bad values (Date objects, etc.)
      const k = `${r.name}||${r.periodId}`;
      if (!sd[k]) sd[k] = {};
      sd[k][toDateStr(r.date)] = timeStr;
    });
    shiftData = sd;

    // adminEdits — accept valid times AND "-" (explicit clear marker)
    const ae = {};
    (json.adminEdits || []).forEach(r => {
      if (!r.name || !r.periodId || !r.date) return;
      const timeStr = String(r.time ?? '').trim();
      if (!isValidTime(timeStr) && timeStr !== '-') return;
      const k = `${r.name}||${r.periodId}`;
      if (!ae[k]) ae[k] = {};
      ae[k][toDateStr(r.date)] = timeStr;
    });
    // Merge local adminEdits on top (local wins — more recent than cloud)
    const localAe = JSON.parse(localStorage.getItem('adminEdits') || '{}');
    Object.entries(localAe).forEach(([k, dates]) => {
      if (!ae[k]) ae[k] = {};
      Object.entries(dates).forEach(([date, val]) => { ae[k][date] = val; });
    });
    adminEdits = ae;

    // staffList — sync from cloud if available
    if (Array.isArray(json.staffList) && json.staffList.length > 0) {
      staffList = json.staffList.map(s => ({
        name: String(s.name || ''),
        type: String(s.type || ''),
      })).filter(s => s.name);
    }

    saveLocal();
    setLoading(100);
    return true;
  } catch(e) { setLoading(100); return false; }
}

// ============================================================
// UTILS
// ============================================================
function showToast(msg, isErr=false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' error' : '');
  setTimeout(() => t.className = 'toast', 2800);
}

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
}

function switchTab(tab, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
}

function datesBetween(start, end) {
  const out = []; let d = new Date(start + 'T00:00:00');
  const e = new Date(end + 'T00:00:00');
  while (d <= e) { out.push(d.toISOString().slice(0,10)); d.setDate(d.getDate()+1); }
  return out;
}

function getWeeks(days) {
  const weeks = []; let week = [];
  days.forEach(ds => {
    week.push(ds);
    if (new Date(ds).getDay() === 0) { weeks.push(week); week = []; }
  });
  if (week.length) weeks.push(week);
  return weeks;
}

function calcHours(t) {
  if (!t || t === '-') return 0;
  const p = t.split('-');
  const raw = parseInt(p[1]) - parseInt(p[0]);
  return raw > 6 ? raw - 1 : raw;
}

function fmtDate(ds) {
  const d = new Date(ds + 'T00:00:00');
  return `${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`;
}

// ============================================================
// PASSWORD
// ============================================================
function getAdminPw() { return localStorage.getItem('adminPw') || DEFAULT_PW; }

function askAdminPassword() {
  document.getElementById('pw-input').value = '';
  document.getElementById('pw-error').textContent = '';
  document.getElementById('pw-overlay').classList.add('open');
  setTimeout(() => document.getElementById('pw-input').focus(), 80);
}

function checkPassword() {
  if (document.getElementById('pw-input').value === getAdminPw()) {
    document.getElementById('pw-overlay').classList.remove('open');
    goAdmin();
  } else {
    document.getElementById('pw-error').textContent = '⚠ パスワードが違います';
    document.getElementById('pw-input').value = '';
    setTimeout(() => document.getElementById('pw-error').textContent = '', 2000);
  }
}

function changePassword() {
  const v = document.getElementById('pw-new').value.trim();
  if (v.length < 4) { showToast('⚠ 4文字以上で設定してください', true); return; }
  localStorage.setItem('adminPw', v);
  document.getElementById('pw-new').value = '';
  showToast('✓ パスワードを変更しました');
}

// ============================================================
// STAFF SCREEN
// ============================================================
let selName = null, selPeriodId = null, selDays = {}, popupDate = null;

async function goStaff() {
  showScreen('staff');
  selName = null; selPeriodId = null; selDays = {};

  // Build name grid
  const g = document.getElementById('name-grid');
  g.innerHTML = '';
  staffList.forEach(s => {
    const b = document.createElement('button');
    b.className = 'name-chip'; b.textContent = s.name;
    b.onclick = () => {
      selName = s.name; selDays = {};
      document.querySelectorAll('.name-chip').forEach(c => c.classList.remove('selected'));
      b.classList.add('selected');
      // load existing for selected period
      if (selPeriodId) {
        const k = `${selName}||${selPeriodId}`;
        selDays = shiftData[k] ? JSON.parse(JSON.stringify(shiftData[k])) : {};
        buildCalendar(); updateSummary();
      }
      updateSubmitBtn();
    };
    g.appendChild(b);
  });

  // Sync from cloud to get latest periods
  const ok = await syncFromCloud();
  renderStaffPeriods();
  document.getElementById('cal-section').style.display = 'none';
  updateSubmitBtn();
}

function renderStaffPeriods() {
  const el = document.getElementById('staff-period-list');
  if (!periods.length) {
    el.innerHTML = '<div class="no-periods">管理者がまだ募集期間を設定していません</div>';
    return;
  }
  el.innerHTML = '';
  periods.forEach(p => {
    const d = document.createElement('div');
    d.className = 'period-chip';
    d.innerHTML = `<div><div class="pname">${p.name}</div><div class="pdates">${p.start} 〜 ${p.end}</div></div><div class="pcheck">✓</div>`;
    d.onclick = () => {
      selPeriodId = p.id; selDays = {};
      document.querySelectorAll('.period-chip').forEach(c => c.classList.remove('selected'));
      d.classList.add('selected');
      if (selName) {
        const k = `${selName}||${selPeriodId}`;
        selDays = shiftData[k] ? JSON.parse(JSON.stringify(shiftData[k])) : {};
      }
      document.getElementById('cal-section').style.display = 'block';
      buildCalendar(); updateSummary(); updateSubmitBtn();
    };
    el.appendChild(d);
  });
}

function buildCalendar() {
  const p = periods.find(x => x.id === selPeriodId); if (!p) return;
  const days = datesBetween(p.start, p.end);
  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';
  const firstDow = new Date(days[0] + 'T00:00:00').getDay();
  for (let i = 0; i < firstDow; i++) {
    const e = document.createElement('div'); e.className = 'cal-day empty'; grid.appendChild(e);
  }
  const today = new Date().toISOString().slice(0,10);
  days.forEach(ds => {
    const d = new Date(ds + 'T00:00:00'); const dow = d.getDay();
    const el = document.createElement('div'); el.className = 'cal-day';
    if (dow === 0) el.classList.add('sun'); if (dow === 6) el.classList.add('sat');
    if (ds === today) el.classList.add('today');
    if (selDays[ds]) el.classList.add('has-time');
    const n = document.createElement('div'); n.className = 'day-num'; n.textContent = d.getDate(); el.appendChild(n);
    if (selDays[ds]) { const t = document.createElement('div'); t.className = 'day-time'; t.textContent = selDays[ds]; el.appendChild(t); }
    el.onclick = () => openTimePopup(ds);
    grid.appendChild(el);
  });
}

function openTimePopup(ds) {
  if (!selName) { showToast('⚠ まず名前を選択してください', true); return; }
  popupDate = ds;
  const d = new Date(ds + 'T00:00:00');
  document.getElementById('popup-title').textContent = `${d.getMonth()+1}月${d.getDate()}日（${DOW[d.getDay()]}）`;
  const ss = document.getElementById('t-start'), es = document.getElementById('t-end');
  ss.innerHTML = ''; es.innerHTML = '';
  for (let h = 12; h <= 22; h++) {
    const o = `<option value="${h}">${String(h).padStart(2,'0')}:00</option>`;
    ss.innerHTML += o; es.innerHTML += o;
  }
  if (selDays[ds]) { const p = selDays[ds].split('-'); ss.value = p[0]; es.value = p[1]; }
  else { ss.value = 12; es.value = 18; }
  updateBreakNote();
  ss.onchange = es.onchange = updateBreakNote;
  document.getElementById('popup-del').style.display = selDays[ds] ? '' : 'none';
  document.getElementById('time-overlay').classList.add('open');
}

function updateBreakNote() {
  const s = parseInt(document.getElementById('t-start').value);
  const e = parseInt(document.getElementById('t-end').value);
  document.getElementById('break-note').style.display = (e - s > 6) ? '' : 'none';
}

function closeTimePopup() { document.getElementById('time-overlay').classList.remove('open'); popupDate = null; }

function clearDay() {
  if (popupDate) { delete selDays[popupDate]; closeTimePopup(); buildCalendar(); updateSummary(); updateSubmitBtn(); }
}

function confirmTime() {
  const s = parseInt(document.getElementById('t-start').value);
  const e = parseInt(document.getElementById('t-end').value);
  if (e <= s) { showToast('⚠ 終了は開始より後にしてください', true); return; }
  selDays[popupDate] = `${s}-${e}`;
  closeTimePopup(); buildCalendar(); updateSummary(); updateSubmitBtn();
}

function updateSummary() {
  const box = document.getElementById('summary-box'), list = document.getElementById('summary-list');
  const entries = Object.entries(selDays).sort((a,b) => a[0].localeCompare(b[0]));
  if (!entries.length) { box.style.display = 'none'; return; }
  box.style.display = '';
  list.innerHTML = entries.map(([ds, time]) => {
    const h = calcHours(time);
    const raw = parseInt(time.split('-')[1]) - parseInt(time.split('-')[0]);
    const note = raw > 6
      ? `<span style="font-size:.62rem;color:#8a6d00"> (-1h休憩=${h}h)</span>`
      : `<span style="font-size:.62rem;color:var(--text3)"> (${h}h)</span>`;
    return `<div class="s-item"><span class="s-date">${fmtDate(ds)}</span><span class="s-time">${time}${note}</span></div>`;
  }).join('');
}

function updateSubmitBtn() {
  document.getElementById('submit-btn').disabled = !selName || !selPeriodId || !Object.keys(selDays).length;
}

async function submitShift() {
  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = '送信中... ⏳';
  const period = periods.find(p => p.id === selPeriodId);
  const key = `${selName}||${selPeriodId}`;
  shiftData[key] = JSON.parse(JSON.stringify(selDays));
  saveLocal();
  const ok = await cloudPost({action:'submitShift', name:selName, periodId:selPeriodId, periodName:period?.name||'', days:selDays});
  if (ok) {
    showToast(`✓ ${selName} のシフトを送信しました！`);
    selDays = {}; buildCalendar(); updateSummary();
  } else {
    showToast('⚠ クラウド送信失敗。入力内容は保持されています。再度お試しください。', true);
  }
  btn.disabled = false; btn.textContent = '登録を完了する ✓';
  updateSubmitBtn();
}

// ============================================================
// ADMIN SCREEN
// ============================================================
let adminView = 'staff';
let pendingEdits = {};

async function goAdmin() {
  showScreen('admin');
  document.getElementById('admin-tbody').innerHTML =
    '<tr><td colspan="99" style="padding:20px;text-align:center;color:var(--text2);">☁ クラウドから読み込み中...</td></tr>';
  const ok = await syncFromCloud();
  showToast(ok ? '☁ クラウドと同期しました' : '⚠ クラウド接続失敗。ローカルデータを表示。', !ok);
  renderAdminPeriodSel();
  renderPeriodList();
  renderStaffSettings();
  renderAdminTable();
}

function renderAdminPeriodSel() {
  const sel = document.getElementById('admin-period-sel');
  const cur = sel.value;
  sel.innerHTML = '<option value="">— 期間を選択 —</option>';
  periods.forEach(p => {
    const o = document.createElement('option');
    o.value = p.id; o.textContent = `${p.name}（${p.start}〜${p.end}）`;
    sel.appendChild(o);
  });
  if (cur) sel.value = cur;
}

function setView(v) {
  adminView = v;
  document.getElementById('vt-staff').classList.toggle('active', v === 'staff');
  document.getElementById('vt-admin').classList.toggle('active', v === 'admin');
  document.getElementById('leg-warn').style.display = v === 'admin' ? 'flex' : 'none';
  document.getElementById('save-admin-btn').style.display = v === 'admin' ? '' : 'none';
  pendingEdits = {};
  renderAdminTable();
}

function renderAdminTable() {
  const pid = document.getElementById('admin-period-sel').value;
  const thead = document.getElementById('admin-thead');
  const tbody  = document.getElementById('admin-tbody');
  if (!pid) {
    thead.innerHTML = '';
    tbody.innerHTML = '<tr><td colspan="99" style="padding:20px;text-align:center;color:var(--text2);">期間を選択してください</td></tr>';
    document.getElementById('stats-row').innerHTML = '';
    return;
  }
  const period = periods.find(x => x.id === pid); if (!period) return;
  const days  = datesBetween(period.start, period.end);
  const weeks = getWeeks(days);

  // Header row1: week groups
  let h1 = '<tr><th class="th-name" rowspan="2">氏名</th><th class="th-type-col" rowspan="2">形態</th>';
  let h2 = '<tr>';
  weeks.forEach((wd, wi) => {
    const bl = wi > 0 ? 'border-left:2px solid var(--teal);' : '';
    h1 += `<th colspan="${1+wd.length}" style="${bl}background:#333;">第${wi+1}週</th>`;
    h2 += `<th style="${bl}background:#222;color:var(--yellow);">週計h</th>`;
    wd.forEach(ds => {
      const d = new Date(ds+'T00:00:00'); const dow = d.getDay();
      const c = dow===0?'color:var(--red);':dow===6?'color:var(--teal);':'';
      h2 += `<th style="${c}">${d.getDate()}<br><span style="font-weight:400;font-size:.62rem">${DOW[dow]}</span></th>`;
    });
  });
  h1 += '</tr>'; h2 += '</tr>';
  thead.innerHTML = h1 + h2;

  // Body
  let bHTML = '';
  const dayTotals = {}; days.forEach(ds => dayTotals[ds] = 0);
  const weekTotals = weeks.map(() => 0);
  let totStaff = 0, totHours = 0;
  const daysSet = new Set();

  staffList.forEach(s => {
    const key = `${s.name}||${pid}`;
    const sr = shiftData[key]  || {};
    const ar = adminEdits[key] || {};
    const excludeFromTotal = (s.type === '店長' || s.type === '社員');
    bHTML += `<tr><td class="td-name">${s.name}</td><td class="td-type">${s.type||''}</td>`;
    let grandH = 0;
    weeks.forEach((wd, wi) => {
      let wh = 0;
      wd.forEach(ds => {
        const val = adminView === 'admin'
          ? (pendingEdits[key]?.[ds] !== undefined ? pendingEdits[key][ds] : (ar[ds] ?? sr[ds]))
          : sr[ds];
        if (val && val !== '-') {
          const h = calcHours(val); wh += h;
          if (!excludeFromTotal) { dayTotals[ds] += h; daysSet.add(ds); }
        }
      });
      grandH += wh;
      if (!excludeFromTotal) weekTotals[wi] += wh;
      const bl = wi > 0 ? 'border-left:2px solid var(--teal);' : '';
      bHTML += `<td class="td-hours" style="${bl}">${wh||'-'}</td>`;
      wd.forEach(ds => {
        const sv = sr[ds] || null;
        if (adminView === 'staff') {
          bHTML += sv ? `<td><span class="sc sc-staff">${sv}</span></td>` : `<td style="color:#ccc;font-size:.7rem">-</td>`;
        } else {
          const pv = pendingEdits[key]?.[ds];
          const rawAdmin = ar.hasOwnProperty(ds) ? ar[ds] : undefined;
          const raw = pv !== undefined ? pv : (rawAdmin !== undefined ? rawAdmin : (sv ?? ''));
          const dv = (raw === '-') ? '' : raw;
          let warn = false;
          if (dv) {
            const m = dv.match(/^(\d{1,2})-(\d{1,2})$/);
            if (m) {
              if (!sv) warn = true;
              else { const sp = sv.split('-'); if (parseInt(m[1])<parseInt(sp[0])||parseInt(m[2])>parseInt(sp[1])) warn=true; }
            }
          }
          bHTML += `<td class="edit-cell"><input class="${warn?'warn':''}"
            data-key="${key}" data-date="${ds}" data-staff="${sv||''}"
            value="${dv}" placeholder="-"
            oninput="onCellInput(this)" onfocus="this.select()"></td>`;
        }
      });
    });
    if (!excludeFromTotal) { totHours += grandH; if (grandH > 0) totStaff++; }
    bHTML += '</tr>';
  });

  // PT total row
  bHTML += '<tr class="total-row"><td class="td-name">PT時數計</td><td></td>';
  weeks.forEach((wd, wi) => {
    const bl = wi > 0 ? 'border-left:2px solid var(--teal);' : '';
    bHTML += `<td class="td-hours" style="${bl}">${weekTotals[wi]||'-'}</td>`;
    wd.forEach(ds => { bHTML += `<td style="font-weight:700;color:var(--black)">${dayTotals[ds]||'-'}</td>`; });
  });
  bHTML += '</tr>';
  tbody.innerHTML = bHTML;

  document.getElementById('stats-row').innerHTML = `
    <div class="stat"><div class="sl">登録スタッフ</div><div class="sv">${totStaff}</div></div>
    <div class="stat"><div class="sl">総勤務時間</div><div class="sv">${totHours}h</div></div>
    <div class="stat"><div class="sl">シフト有日数</div><div class="sv">${daysSet.size}</div></div>
    ${weeks.map((_,wi)=>`<div class="stat"><div class="sl">第${wi+1}週 合計</div><div class="sv">${weekTotals[wi]}h</div></div>`).join('')}
  `;
}

function onCellInput(el) {
  const key = el.dataset.key, date = el.dataset.date, sv = el.dataset.staff || null;
  const val = el.value.trim();
  if (!pendingEdits[key]) pendingEdits[key] = {};
  pendingEdits[key][date] = val;
  let warn = false;
  if (val) {
    const m = val.match(/^(\d{1,2})-(\d{1,2})$/);
    if (m) {
      if (!sv) warn = true;
      else { const sp = sv.split('-'); if (parseInt(m[1])<parseInt(sp[0])||parseInt(m[2])>parseInt(sp[1])) warn=true; }
    }
  }
  el.classList.toggle('warn', warn);
  // update week total live
  const row = el.closest('tr'); if (!row) return;
  const pid = document.getElementById('admin-period-sel').value;
  const period = periods.find(x=>x.id===pid); if (!period) return;
  const weeks = getWeeks(datesBetween(period.start, period.end));
  const ar = adminEdits[key]||{}, sr = shiftData[key]||{};
  let col = 2;
  weeks.forEach(wd => {
    let wh = 0;
    wd.forEach(ds => {
      const pv = pendingEdits[key]?.[ds];
      const v = pv !== undefined ? pv : (ar[ds] ?? sr[ds]);
      if (v && v !== '-') wh += calcHours(v);
    });
    const tds = row.querySelectorAll('td');
    if (tds[col]) tds[col].textContent = wh || '-';
    col += 1 + wd.length;
  });
}

async function saveAdminEdits() {
  const pid = document.getElementById('admin-period-sel').value;

  // Apply pending edits locally
  Object.entries(pendingEdits).forEach(([key, dates]) => {
    if (!adminEdits[key]) adminEdits[key] = {};
    Object.entries(dates).forEach(([date, val]) => {
      adminEdits[key][date] = (val === '' || val == null) ? '-' : val;
    });
  });

  saveLocal();

  // Build full payload for this period: all staff in one request
  const allEdits = staffList.map(s => {
    const key = `${s.name}||${pid}`;
    return { name: s.name, days: adminEdits[key] || {} };
  });

  const ok = await cloudPost({ action: 'saveAdminEditsBulk', periodId: pid, allEdits });

  pendingEdits = {};
  showToast(ok ? '✓ 排班を保存しました' : '⚠ クラウド保存失敗', !ok);
  renderAdminTable();
}

function clearPeriodData() {
  const pid = document.getElementById('admin-period-sel').value;
  if (!pid) { showToast('⚠ 期間を選択してください', true); return; }
  if (!confirm('この期間の提出データを削除しますか？')) return;
  Object.keys(shiftData).forEach(k  => { if (k.includes(`||${pid}`)) delete shiftData[k]; });
  Object.keys(adminEdits).forEach(k => { if (k.includes(`||${pid}`)) delete adminEdits[k]; });
  saveLocal(); renderAdminTable(); showToast('削除しました');
}

// ============================================================
// PERIOD MANAGEMENT
// ============================================================
async function createPeriod() {
  const name = document.getElementById('np-name').value.trim();
  const start = document.getElementById('np-start').value;
  const end   = document.getElementById('np-end').value;
  if (!name||!start||!end) { showToast('⚠ 全項目を入力してください', true); return; }
  if (end < start) { showToast('⚠ 終了日は開始日以降にしてください', true); return; }
  const id = 'p' + Date.now();
  periods.push({id, name, start, end});
  saveLocal();
  const ok = await cloudPost({action:'savePeriods', periods});
  if (!ok) showToast('⚠ クラウド保存失敗', true);
  renderPeriodList(); renderAdminPeriodSel();
  document.getElementById('np-name').value = '';
  document.getElementById('np-start').value = '';
  document.getElementById('np-end').value = '';
  showToast(`✓ 期間「${name}」を作成しました`);
}

function renderPeriodList() {
  const el = document.getElementById('period-list-admin');
  if (!el) return;
  if (!periods.length) { el.innerHTML = '<div style="color:var(--text3);font-size:.82rem;">まだ期間がありません</div>'; return; }
  el.innerHTML = '';
  periods.forEach(p => {
    const row = document.createElement('div'); row.className = 'period-row';
    row.innerHTML = `<div class="pr-name">${p.name}</div><div class="pr-dates">${p.start} 〜 ${p.end}</div>
      <button class="pr-del" onclick="deletePeriod('${p.id}',event)">削除</button>`;
    el.appendChild(row);
  });
}

async function deletePeriod(id, e) {
  e.stopPropagation();
  if (!confirm('この期間を削除しますか？')) return;
  periods = periods.filter(p => p.id !== id);
  Object.keys(shiftData).forEach(k  => { if (k.includes(`||${id}`)) delete shiftData[k]; });
  Object.keys(adminEdits).forEach(k => { if (k.includes(`||${id}`)) delete adminEdits[k]; });
  saveLocal();
  await cloudPost({action:'savePeriods', periods});
  renderPeriodList(); renderAdminPeriodSel(); renderAdminTable();
  showToast('削除しました');
}

function renderStaffSettings() {
  const el = document.getElementById('staff-edit-list'); if (!el) return;
  const types = ['','店長','社員','18','28','30'];

    <div class="sei">
      <input value="${s.name}" id="sn-${i}" placeholder="名前">
      <select id="st-${i}">${types.map(t=>`<option value="${t}"${s.type===t?' selected':''}>${t||'-'}</option>`).join('')}</select>
      <button class="icon-btn rm" onclick="removeStaff(${i})">✕</button>
    </div>`).join('');
}
function addStaffRow()  { staffList.push({name:'',type:''}); renderStaffSettings(); }
function removeStaff(i) { staffList.splice(i,1); renderStaffSettings(); }
async function saveStaffList() {
  staffList = staffList.map((_,i) => ({
    name: document.getElementById(`sn-${i}`).value.trim(),
    type: document.getElementById(`st-${i}`).value,
  })).filter(s => s.name);
  saveLocal();
  const ok = await cloudPost({action:'saveStaffList', staffList});
  showToast(ok ? '✓ 保存しました（クラウド同期済）' : '⚠ ローカルのみ保存（クラウド失敗）', !ok);
}
async function resetStaffList() {
  if (!confirm('デフォルトにリセットしますか？')) return;
  staffList = JSON.parse(JSON.stringify(DEFAULT_STAFF));
  saveLocal();
  await cloudPost({action:'saveStaffList', staffList});
  renderStaffSettings(); showToast('リセットしました');
}

// ============================================================
// PRINT
// ============================================================
function printShift() {
  const pid = document.getElementById('admin-period-sel').value;
  if (!pid) { showToast('⚠ 期間を選択してください', true); return; }
  const period = periods.find(x=>x.id===pid); if (!period) return;
  const days = datesBetween(period.start, period.end);
  const weeks = getWeeks(days);

  let html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${period.name}</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans TC','Noto Sans JP',sans-serif;font-size:11px;background:#fff;}
.page{padding:14px 16px;page-break-after:always;}
.page:last-child{page-break-after:auto;}
h2{font-size:13px;font-weight:700;margin-bottom:8px;border-bottom:2px solid #F7C242;padding-bottom:4px;}
table{width:100%;border-collapse:collapse;margin-bottom:8px;}
th,td{border:1px solid #888;padding:4px 5px;text-align:center;vertical-align:middle;white-space:nowrap;}
th{background:#fff;color:#000;font-size:9px;font-weight:700;border-bottom:2px solid #000;}
th.nm{text-align:left;}td.nm{text-align:left;font-weight:600;}
td.th{font-weight:700;background:#f0f0f0;}
.sun{color:#000;font-weight:700;text-decoration:underline;}.sat{color:#000;font-weight:700;font-style:italic;}
th.sun{border-top:3px double #000;}th.sat{border-top:2px dashed #000;}
.total-row td{background:#e0e0e0;font-weight:700;border-top:2px solid #000;}
@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact;}}
</style></head><body>`;

  weeks.forEach((wd, wi) => {
    const fd = new Date(wd[0]+'T00:00:00'), ld = new Date(wd[wd.length-1]+'T00:00:00');
    html += `<div class="page"><h2>${period.name}　第${wi+1}週　${fd.getMonth()+1}/${fd.getDate()} 〜 ${ld.getMonth()+1}/${ld.getDate()}</h2>
<table><thead><tr><th class="nm">氏名</th><th>形態</th><th>週計h</th>`;
    wd.forEach(ds => {
      const d = new Date(ds+'T00:00:00'); const dow = d.getDay();
      const c = dow===0?' class="sun"':dow===6?' class="sat"':'';
      html += `<th${c}>${d.getMonth()+1}/${d.getDate()}(${DOW[dow]})</th>`;
    });
    html += `</tr></thead><tbody>`;
    const dayTotals = {}; wd.forEach(ds => dayTotals[ds] = 0);
    staffList.forEach(s => {
      const key = `${s.name}||${pid}`;
      const sr = shiftData[key]||{}, ar = adminEdits[key]||{};
      const excludeFromTotal = (s.type === '店長' || s.type === '社員');
      let wh = 0;
      const vals = wd.map(ds => { const raw=ar[ds]??sr[ds]??null; const v=(raw&&raw!=='-')?raw:null; if(v){wh+=calcHours(v); if(!excludeFromTotal) dayTotals[ds]+=calcHours(v);} return v; });
      html += `<tr><td class="nm">${s.name}</td><td>${s.type||''}</td><td class="th">${wh||'-'}</td>`;
      vals.forEach((v,ci) => {
        const dow = new Date(wd[ci]+'T00:00:00').getDay();
        const c = dow===0?' class="sun"':dow===6?' class="sat"':'';
        html += `<td${c}>${v||'-'}</td>`;
      });
      html += '</tr>';
    });
    html += `<tr class="total-row"><td class="nm">PT時數計</td><td></td><td class="th">${Object.values(dayTotals).reduce((a,b)=>a+b,0)}</td>`;
    wd.forEach(ds => { html += `<td>${dayTotals[ds]||'-'}</td>`; });
    html += `</tr></tbody></table></div>`;
  });

  html += '</body></html>';
  const w = window.open('','_blank','width=960,height=720');
  w.document.write(html); w.document.close();
  setTimeout(() => w.print(), 600);
}

// ============================================================
// EXCEL EXPORT
// ============================================================
const MiniXLSX = (() => {
  function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function colLetter(n){let s='';n++;while(n>0){s=String.fromCharCode(64+(n%26||26))+s;n=Math.floor((n-1)/26);}return s;}
  function buildXlsx(sheets){
    const strs=[],strMap={};
    const getStr=v=>{const s=String(v??'');if(strMap[s]===undefined){strMap[s]=strs.length;strs.push(s);}return strMap[s];};
    const sheetXmls=sheets.map(({name,rows,colWidths})=>{
      let xml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">`;
      if(colWidths)xml+='<cols>'+colWidths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')+'</cols>';
      xml+='<sheetData>';
      rows.forEach((row,ri)=>{
        xml+=`<row r="${ri+1}">`;
        row.forEach((cell,ci)=>{
          if(cell==null||cell.v==null||cell.v==='')return;
          const addr=`${colLetter(ci)}${ri+1}`;
          if(cell.t==='n'||typeof cell.v==='number')xml+=`<c r="${addr}" t="n"><v>${cell.v}</v></c>`;
          else xml+=`<c r="${addr}" t="s"><v>${getStr(cell.v)}</v></c>`;
        });
        xml+='</row>';
      });
      xml+='</sheetData></worksheet>';return xml;
    });
    const ssXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><sst xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" count="${strs.length}" uniqueCount="${strs.length}">${strs.map(s=>`<si><t xml:space="preserve">${esc(s)}</t></si>`).join('')}</sst>`;
    const wbXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s,i)=>`<sheet name="${esc(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`;
    const wbRels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((_,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rIdSS" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/sharedStrings" Target="sharedStrings.xml"/></Relationships>`;
    const stylesXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="1"><font><sz val="11"/><name val="Arial"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/></cellXfs></styleSheet>`;
    const pkgRels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;
    const ct=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}<Override PartName="/xl/sharedStrings.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sharedStrings+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`;
    return{sheetXmls,ssXml,wbXml,wbRels,stylesXml,pkgRels,ct};
  }
  function crc32(d){let c=0xFFFFFFFF;for(let i=0;i<d.length;i++){c^=d[i];for(let j=0;j<8;j++)c=(c>>>1)^(c&1?0xEDB88320:0);}return(c^0xFFFFFFFF)>>>0;}
  function concat(arrays){const t=arrays.reduce((s,a)=>s+a.length,0);const o=new Uint8Array(t);let i=0;for(const a of arrays){o.set(a,i);i+=a.length;}return o;}
  function lh(name,size,crc){const b=new Uint8Array(30+name.length),v=new DataView(b.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);[0,0,0].forEach((x,i)=>v.setUint16(6+i*2,x,true));v.setUint32(14,crc,true);v.setUint32(18,size,true);v.setUint32(22,size,true);v.setUint16(26,name.length,true);v.setUint16(28,0,true);b.set(name,30);return b;}
  function cd(name,size,crc,offset){const b=new Uint8Array(46+name.length),v=new DataView(b.buffer);v.setUint32(0,0x02014b50,true);[20,20,0,0,0,0].forEach((x,i)=>v.setUint16(4+i*2,x,true));v.setUint32(16,crc,true);v.setUint32(20,size,true);v.setUint32(24,size,true);v.setUint16(28,name.length,true);[0,0,0,0].forEach((x,i)=>v.setUint16(30+i*2,x,true));v.setUint32(38,0,true);v.setUint32(42,offset,true);b.set(name,46);return b;}
  function eocd(count,cdSize,cdOffset){const b=new Uint8Array(22),v=new DataView(b.buffer);v.setUint32(0,0x06054b50,true);[0,0,count,count].forEach((x,i)=>v.setUint16(4+i*2,x,true));v.setUint32(12,cdSize,true);v.setUint32(16,cdOffset,true);v.setUint16(20,0,true);return b;}
  function toZip(files){const enc=new TextEncoder();const parts=[],cds=[];let offset=0;for(const[name,content]of Object.entries(files)){const nb=enc.encode(name);const db=typeof content==='string'?enc.encode(content):content;const crcv=crc32(db);const lhb=lh(nb,db.length,crcv);parts.push(lhb,db);cds.push(cd(nb,db.length,crcv,offset));offset+=lhb.length+db.length;}const cdBytes=concat(cds);return concat([...parts,cdBytes,eocd(cds.length,cdBytes.length,offset)]);}
  function writeFile(sheets,filename){
    const x=buildXlsx(sheets);
    const files={'[Content_Types].xml':x.ct,'_rels/.rels':x.pkgRels,'xl/workbook.xml':x.wbXml,'xl/_rels/workbook.xml.rels':x.wbRels,'xl/sharedStrings.xml':x.ssXml,'xl/styles.xml':x.stylesXml};
    x.sheetXmls.forEach((xml,i)=>{files[`xl/worksheets/sheet${i+1}.xml`]=xml;});
    const blob=new Blob([toZip(files)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
  return{writeFile};
})();

function exportExcel() {
  const pid = document.getElementById('admin-period-sel').value;
  if (!pid) { showToast('⚠ 期間を選択してください', true); return; }
  const period = periods.find(x=>x.id===pid); if (!period) return;
  const days = datesBetween(period.start, period.end);
  const weeks = getWeeks(days);
  const rows = [];

  // header
  const h1 = [{v:'雇用型態'},{v:'氏名'}];
  weeks.forEach((wd,wi) => { h1.push({v:`第${wi+1}週(h)`}); wd.forEach(ds=>{const d=new Date(ds+'T00:00:00');h1.push({v:`${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`});}); });
  rows.push(h1);

  staffList.forEach(s => {
    const key=`${s.name}||${pid}`;
    const sr=shiftData[key]||{},ar=adminEdits[key]||{};
    const row=[{v:s.type||''},{v:s.name}];
    weeks.forEach(wd=>{
      let wh=0;const vals=[];
      wd.forEach(ds=>{const raw=ar[ds]??sr[ds];const v=(raw&&raw!=='-')?raw:null;vals.push(v?{v}:null);if(v)wh+=calcHours(v);});
      row.push({v:wh,t:'n'});vals.forEach(v=>row.push(v));
    });
    rows.push(row);
  });

  const tRow=[null,{v:'PT時數'}];
  weeks.forEach(wd=>{
    let wt=0;const dv=[];
    wd.forEach(ds=>{let dt=0;staffList.forEach(s=>{const excludeFromTotal=(s.type==='店長'||s.type==='社員');if(excludeFromTotal)return;const key=`${s.name}||${pid}`;const raw=(adminEdits[key]||{})[ds]??(shiftData[key]||{})[ds];if(raw&&raw!=='-')dt+=calcHours(raw);});wt+=dt;dv.push(dt>0?{v:dt,t:'n'}:null);});
    tRow.push({v:wt,t:'n'});dv.forEach(v=>tRow.push(v));
  });
  rows.push(tRow);

  const colWidths=[9,12,...weeks.flatMap(wd=>[8,...wd.map(()=>9)])];
  MiniXLSX.writeFile([{name:period.name.slice(0,31),rows,colWidths}],`${period.name}_シフト.xlsx`);
  showToast('✓ Excel出力完了！');
}
